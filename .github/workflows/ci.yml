name: CI

on:
  push:
    paths-ignore:
      - README.md
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Keep reusable CI calls separate from their callers and other releases.
  group: ci-${{ github.workflow }}-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: /tmp/unifi-sms-ci-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check .
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static assets
        run: python manage.py collectstatic --noinput
      - name: Run Python tests
        run: python manage.py test inbox modem --noinput
      - name: Run JavaScript tests
        run: node --test tests/device_settings.test.cjs
      - name: Audit pinned runtime dependencies
        run: python -m pip_audit --disable-pip --no-deps -r requirements.txt
      - name: Scan Git history for secrets
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all .
      - name: Validate deployment Compose files
        run: |
          docker compose --env-file /dev/null -f compose.ghcr.yaml config --quiet
          docker compose --env-file /dev/null -f docs/compose.nas.yaml config --quiet
      - name: Build Docker image
        run: docker build --tag unifi-sms:ci .
      - name: Verify fresh installation and administrator setup
        env:
          SMOKE_TEST_REF: ${{ github.workflow_sha }}
        run: |
          # Older release commits may not include the smoke test added with this workflow.
          git show "$SMOKE_TEST_REF:scripts/smoke_install.py" > "$RUNNER_TEMP/unifi-sms-smoke-install.py"
          python "$RUNNER_TEMP/unifi-sms-smoke-install.py" --image unifi-sms:ci
