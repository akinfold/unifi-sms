name: CI

on:
  push:
    paths-ignore:
      - README.md
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        required: false
        type: string
      target_tag:
        description: Release being validated; select a stable upgrade source below this version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Keep reusable CI calls separate from their callers and other releases.
  group: ci-${{ github.workflow }}-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DIR: /tmp/unifi-sms-ci-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check .
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static assets
        run: python manage.py collectstatic --noinput
      - name: Run Python tests
        run: python manage.py test inbox modem --noinput
      - name: Run JavaScript tests
        run: node --test tests/*.test.cjs
      - name: Audit pinned runtime dependencies
        run: python -m pip_audit --disable-pip --no-deps -r requirements.txt
      - name: Scan Git history for secrets
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all .
      - name: Validate deployment Compose files
        run: |
          docker compose --env-file /dev/null -f compose.ghcr.yaml config --quiet
          docker compose --env-file /dev/null -f docs/compose.nas.yaml config --quiet
      - name: Build Docker image
        run: docker build --tag unifi-sms:ci .
      - name: Load smoke tests from the workflow commit
        env:
          SMOKE_TEST_REF: ${{ github.workflow_sha }}
        run: |
          # Older application commits may not contain the current validation scripts.
          SMOKE_TEST_DIR="$RUNNER_TEMP/unifi-sms-smoke"
          mkdir -p "$SMOKE_TEST_DIR"
          git show "$SMOKE_TEST_REF:scripts/smoke_install.py" > "$SMOKE_TEST_DIR/smoke_install.py"
          git show "$SMOKE_TEST_REF:scripts/smoke_upgrade.py" > "$SMOKE_TEST_DIR/smoke_upgrade.py"
          git show "$SMOKE_TEST_REF:scripts/smoke_sms.py" > "$SMOKE_TEST_DIR/smoke_sms.py"
          git show "$SMOKE_TEST_REF:.github/scripts/previous-release.cjs" > "$SMOKE_TEST_DIR/previous-release.cjs"
          echo "SMOKE_TEST_DIR=$SMOKE_TEST_DIR" >> "$GITHUB_ENV"
      - name: Verify fresh installation and administrator setup
        run: python "$SMOKE_TEST_DIR/smoke_install.py" --image unifi-sms:ci
      - name: Verify SMS import, durable storage, slot cleanup, and email delivery
        run: python "$SMOKE_TEST_DIR/smoke_sms.py" --image unifi-sms:ci
      - name: Select the previous stable release
        id: previous
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_TAG: ${{ inputs.target_tag }}
        with:
          script: |
            const {previousRelease} = require(`${process.env.SMOKE_TEST_DIR}/previous-release.cjs`);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const previous = previousRelease(releases, process.env.TARGET_TAG || '');
            if (!previous) {
              core.info('No earlier stable release exists; the first release has no upgrade source.');
              await core.summary.addRaw('Upgrade check skipped: no earlier published stable release exists.').write();
              return;
            }
            let {data: {object}} = await github.rest.git.getRef({
              ...context.repo, ref: `tags/${previous.tag_name}`,
            });
            while (object.type === 'tag') {
              ({data: {object}} = await github.rest.git.getTag({...context.repo, tag_sha: object.sha}));
            }
            if (object.type !== 'commit') throw new Error('The previous release tag must resolve to a commit.');
            const image = `ghcr.io/${context.repo.owner}/${context.repo.repo}:${previous.tag_name.slice(1)}`.toLowerCase();
            core.setOutput('image', image);
            core.setOutput('sha', object.sha);
            await core.summary.addHeading('Upgrade compatibility').addRaw(
              `Source: ${previous.tag_name} (${object.sha}) → ${process.env.TARGET_TAG || 'candidate commit'}`,
            ).write();
      - name: Verify upgrade preserves settings, administrator, and SMS
        if: steps.previous.outputs.image != ''
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          docker pull "$PREVIOUS_IMAGE"
          revision=$(docker image inspect "$PREVIOUS_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          if [ "$revision" != "$PREVIOUS_SHA" ]; then
            echo '::error::The previous image revision does not match its published release tag.'
            exit 1
          fi
          digest=$(docker image inspect "$PREVIOUS_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "Upgrade source image: $digest"
          python "$SMOKE_TEST_DIR/smoke_upgrade.py" --previous-image "$digest" --image unifi-sms:ci
