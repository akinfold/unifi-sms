name: CI

on:
  push:
    paths-ignore:
      - README.md
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        required: false
        type: string
      export_images:
        description: Retain validated platform images for release promotion
        required: false
        default: false
        type: boolean
      target_tag:
        description: Release being validated; select a stable upgrade source below this version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Keep reusable CI calls separate from their callers and other releases.
  group: ci-${{ github.workflow }}-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Validate linux/${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      DATA_DIR: /tmp/unifi-sms-ci-data
      RELEASE_SHA: ${{ inputs.ref || github.sha }}
      IMAGE_VERSION: ${{ inputs.target_tag || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.lock.txt
            requirements-dev.txt
            scripts/requirements-ui.txt
            scripts/requirements-integrations.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          pinned = {line.strip() for line in Path('requirements.txt').read_text().splitlines()
                    if line.strip() and not line.startswith('#')}
          locked = {line.rstrip(' \\') for line in Path('requirements-runtime.lock.txt').read_text().splitlines()
                    if line and not line.startswith(('#', ' '))}
          assert pinned == locked, 'Runtime hash lock differs from requirements.txt'
          PYTHON
          python -m pip install --require-hashes --only-binary=:all: -r requirements-runtime.lock.txt
          python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check .
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static assets
        run: python manage.py collectstatic --noinput
      - name: Run Python tests
        run: |
          python manage.py test inbox modem --noinput
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Run security regressions
        run: >-
          python manage.py test inbox.test_security_auth inbox.test_security_smtp
          inbox.test_security_deadlines modem.tests.test_ssh --noinput
      - name: Run JavaScript tests
        run: node --test tests/*.test.cjs
      - name: Audit pinned runtime dependencies
        run: python -m pip_audit --disable-pip --no-deps -r requirements.txt
      - name: Scan Git history for secrets
        if: matrix.architecture == 'amd64'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all .
      - name: Validate deployment Compose files
        run: |
          docker compose --env-file /dev/null -f compose.ghcr.yaml config --quiet
          docker compose --env-file /dev/null -f docs/compose.nas.yaml config --quiet
      - name: Set up Buildx for release manifest validation
        if: matrix.architecture == 'amd64'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.1
          name: unifi-sms-manifest-validation
          use: false
      - name: Verify release metadata with Docker-format platform manifests
        if: matrix.architecture == 'amd64'
        env:
          VALIDATION_REF: ${{ github.workflow_sha }}
        run: |
          git show "$VALIDATION_REF:.github/scripts/release-artifacts.py" > "$RUNNER_TEMP/release-artifacts.py"
          git show "$VALIDATION_REF:scripts/smoke_release_manifest.py" > "$RUNNER_TEMP/smoke_release_manifest.py"
          python "$RUNNER_TEMP/smoke_release_manifest.py" --helper "$RUNNER_TEMP/release-artifacts.py"
      - name: Build the platform image once
        env:
          VALIDATION_REF: ${{ github.workflow_sha }}
        run: |
          git show "$VALIDATION_REF:.github/scripts/release-artifacts.py" > "$RUNNER_TEMP/release-artifacts.py"
          python "$RUNNER_TEMP/release-artifacts.py" build --architecture '${{ matrix.architecture }}'
      - name: Load smoke tests from the workflow commit
        env:
          SMOKE_TEST_REF: ${{ github.workflow_sha }}
        run: |
          # Older application commits may not contain the current validation scripts.
          SMOKE_TEST_DIR="$RUNNER_TEMP/unifi-sms-smoke"
          mkdir -p "$SMOKE_TEST_DIR"
          git show "$SMOKE_TEST_REF:scripts/smoke_install.py" > "$SMOKE_TEST_DIR/smoke_install.py"
          git show "$SMOKE_TEST_REF:scripts/smoke_upgrade.py" > "$SMOKE_TEST_DIR/smoke_upgrade.py"
          git show "$SMOKE_TEST_REF:scripts/smoke_upgrade_cycle.py" > "$SMOKE_TEST_DIR/smoke_upgrade_cycle.py"
          git show "$SMOKE_TEST_REF:scripts/smoke_sms.py" > "$SMOKE_TEST_DIR/smoke_sms.py"
          git show "$SMOKE_TEST_REF:scripts/smoke_forwarding_ui.py" > "$SMOKE_TEST_DIR/smoke_forwarding_ui.py"
          git show "$SMOKE_TEST_REF:scripts/smoke_integrations.py" > "$SMOKE_TEST_DIR/smoke_integrations.py"
          git show "$SMOKE_TEST_REF:scripts/requirements-integrations.txt" > "$SMOKE_TEST_DIR/requirements-integrations.txt"
          git show "$SMOKE_TEST_REF:scripts/requirements-ui.txt" > "$SMOKE_TEST_DIR/requirements-ui.txt"
          git show "$SMOKE_TEST_REF:.github/scripts/previous-release.cjs" > "$SMOKE_TEST_DIR/previous-release.cjs"
          echo "SMOKE_TEST_DIR=$SMOKE_TEST_DIR" >> "$GITHUB_ENV"
      - name: Install browser and MCP test dependencies
        run: |
          python -m pip install -r "$SMOKE_TEST_DIR/requirements-integrations.txt"
          python -m playwright install --with-deps chromium
      - name: Verify fresh installation and administrator setup
        run: python "$SMOKE_TEST_DIR/smoke_install.py" --image unifi-sms:ci
      - name: Verify SMS import, durable storage, slot cleanup, and email delivery
        run: python "$SMOKE_TEST_DIR/smoke_sms.py" --image unifi-sms:ci
      - name: Verify email forwarding statuses, sent times, and disabled visibility
        id: forwarding-ui
        run: >-
          python "$SMOKE_TEST_DIR/smoke_forwarding_ui.py" --image unifi-sms:ci
          --artifacts-dir "$RUNNER_TEMP/unifi-sms-forwarding-ui"
      - name: Upload forwarding UI failure diagnostics
        if: failure() && steps.forwarding-ui.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forwarding-ui-failure-${{ matrix.architecture }}
          path: ${{ runner.temp }}/unifi-sms-forwarding-ui
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify REST API, MCP, webhooks, and integration statuses
        id: integrations
        run: >-
          python "$SMOKE_TEST_DIR/smoke_integrations.py" --image unifi-sms:ci
          --artifacts-dir "$RUNNER_TEMP/unifi-sms-integrations"
      - name: Upload integration failure diagnostics
        if: failure() && steps.integrations.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrations-failure-${{ matrix.architecture }}
          path: ${{ runner.temp }}/unifi-sms-integrations
          if-no-files-found: ignore
          retention-days: 7
      - name: Select the previous stable release
        id: previous
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_TAG: ${{ inputs.target_tag }}
        with:
          script: |
            const {previousRelease} = require(`${process.env.SMOKE_TEST_DIR}/previous-release.cjs`);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const previous = previousRelease(releases, process.env.TARGET_TAG || '');
            if (!previous) {
              core.info('No earlier stable release exists; the first release has no upgrade source.');
              await core.summary.addRaw('Upgrade check skipped: no earlier published stable release exists.').write();
              return;
            }
            let {data: {object}} = await github.rest.git.getRef({
              ...context.repo, ref: `tags/${previous.tag_name}`,
            });
            while (object.type === 'tag') {
              ({data: {object}} = await github.rest.git.getTag({...context.repo, tag_sha: object.sha}));
            }
            if (object.type !== 'commit') throw new Error('The previous release tag must resolve to a commit.');
            const image = `ghcr.io/${context.repo.owner}/${context.repo.repo}:${previous.tag_name.slice(1)}`.toLowerCase();
            core.setOutput('image', image);
            core.setOutput('sha', object.sha);
            await core.summary.addHeading('Upgrade compatibility').addRaw(
              `Source: ${previous.tag_name} (${object.sha}) → ${process.env.TARGET_TAG || 'candidate commit'}`,
            ).write();
      - name: Verify preserved data and full SMS, email, REST, MCP, and webhook cycle after upgrade
        id: upgrade
        if: steps.previous.outputs.image != ''
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          docker pull "$PREVIOUS_IMAGE"
          revision=$(docker image inspect "$PREVIOUS_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          if [ "$revision" != "$PREVIOUS_SHA" ]; then
            echo '::error::The previous image revision does not match its published release tag.'
            exit 1
          fi
          digest=$(docker image inspect "$PREVIOUS_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "Upgrade source image: $digest"
          python "$SMOKE_TEST_DIR/smoke_upgrade.py" --previous-image "$digest" --image unifi-sms:ci \
            --artifacts-dir "$RUNNER_TEMP/unifi-sms-upgrade"
      - name: Upload upgrade failure diagnostics
        if: failure() && steps.upgrade.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-failure-${{ matrix.architecture }}
          path: ${{ runner.temp }}/unifi-sms-upgrade
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain the exact validated image
        if: inputs.export_images
        run: >-
          python "$RUNNER_TEMP/release-artifacts.py" export
          --architecture '${{ matrix.architecture }}'
          --directory "$RUNNER_TEMP/validated-image"
      - name: Upload the validated platform image
        if: inputs.export_images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-image-${{ matrix.architecture }}
          path: ${{ runner.temp }}/validated-image
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  validate:
    name: validate
    if: always()
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both platform validations to succeed
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
